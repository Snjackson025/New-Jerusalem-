# Triggered run to verify the daily schedule works.
name: NEW-JERUSALEM

# Workflow for NEW JERUSALEM AI (snjackson044-droid/New-Jerusalem-).
# Compiles newjerusalem.cpp and runs smoke tests on every push / PR to
# main that touches the program, the check script, or this workflow.
#
# NEW JERUSALEM AI is a C++ console program: a knowledge, inquiry,
# reasoning, reflection, and chronology system, with KnowledgeEngine,
# InquiryEngine, ReasoningEngine, ReflectionEngine, ChronologyEngine,
# KnowledgeCharacter, and EventLogger. See docs/WORKFLOW.md.

on:
  # Runs every day at 06:00 UTC (01:00 EST).
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - "newjerusalem.cpp"
      - "scripts/newjerusalem-check.sh"
      - ".github/workflows/newjerusalem.yml"
  pull_request:
    branches: [main]
    paths:
      - "newjerusalem.cpp"
      - "scripts/newjerusalem-check.sh"
      - ".github/workflows/newjerusalem.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -o newjerusalem newjerusalem.cpp

      - name: Smoke test — start up and shut down
        run: |
          output=$(printf '0\n' | ./newjerusalem)
          echo "$output" | grep -q "NEW JERUSALEM AI"
          echo "$output" | grep -q "Pursue truth, preserve knowledge"
          echo "$output" | grep -q "New Jerusalem AI shutting down."

      - name: Smoke test — System status
        run: |
          output=$(printf '11\n\n0\n' | ./newjerusalem)
          echo "$output" | grep -q "Knowledge records: 0"
          echo "$output" | grep -q "Inquiry engine: Active"
          echo "$output" | grep -q "Chronology engine: Active"

      - name: Smoke test — Add knowledge and search for it
        run: |
          output=$(printf '1\nHistory\nTest Record\nTest knowledge entry\n\n3\ntest\n\n0\n' | ./newjerusalem)
          echo "$output" | grep -q "Knowledge record saved. ID: 1"
          echo "$output" | grep -q "Test Record"
